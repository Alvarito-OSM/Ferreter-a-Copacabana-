<div class="page-container">

  <div class="page-header">
    <div>
      <h1>{{ esEdicion ? 'Editar Empleado' : 'Nuevo Empleado' }}</h1>
      <p class="page-subtitle">
        {{ esEdicion ? 'Modifica los datos del empleado' : 'Registra un nuevo empleado en el sistema' }}
      </p>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="formEmpleado" (ngSubmit)="guardar()">

      <div class="form-section-title">Información Personal</div>

      <div class="form-grid">
        <div class="form-group">
          <label for="nombres">Nombres <span class="required">*</span></label>
          <input id="nombres" type="text" formControlName="nombres" placeholder="Ej: Juan Carlos">
        </div>

        <div class="form-group">
          <label for="apellidos">Apellidos <span class="required">*</span></label>
          <input id="apellidos" type="text" formControlName="apellidos" placeholder="Ej: Pérez Gómez">
        </div>

        <div class="form-group">
          <label for="ci">Cédula de Identidad <span class="required">*</span></label>
          <input id="ci" type="text" formControlName="ci" placeholder="Ej: 12345678">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="text" formControlName="telefono" placeholder="Ej: 71234567">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="Ej: empleado@ferreteria.bo">
        </div>

        <div class="form-group">
          <label for="cargo">Cargo <span class="required">*</span></label>
          <input id="cargo" type="text" formControlName="cargo" placeholder="Ej: Vendedor">
        </div>
      </div>

      <div class="form-section-title">Acceso al Sistema</div>

      <div class="form-grid">
        <div class="form-group">
          <label for="usuario">Usuario de Sistema <span class="required">*</span></label>
          <input id="usuario" type="text" formControlName="usuario" placeholder="Ej: jperez">
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña <span class="required">*</span></label>
          <input id="contrasena" type="password" formControlName="contrasena" placeholder="Ej: 123456">
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado" formControlName="estado">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/empleados" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary" [disabled]="formEmpleado.invalid">
          {{ esEdicion ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>

    </form>
  </div>

</div>
