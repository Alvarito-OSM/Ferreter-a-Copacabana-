<div class="container mt-4">
  <h2>Gestión de Empleados</h2>
  <button class="btn btn-primary mb-3" routerLink="nuevo">Nuevo Empleado</button>

  <table class="table table-striped table-bordered">
    <thead>
    <tr>
      <th>CI</th>
      <th>Nombre Completo</th>
      <th>Teléfono</th>
      <th>Cargo</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let emp of empleados">
      <td>{{ emp.ci }}</td>
      <td>{{ emp.nombres }} {{ emp.apellidos }}</td>
      <td>{{ emp.telefono }}</td>
      <td>{{ emp.cargo }}</td>
      <td>
        <button class="btn btn-warning btn-sm me-2" [routerLink]="['editar', emp.id]">Editar</button>
        <button class="btn btn-danger btn-sm" (click)="eliminar(emp.id)">Eliminar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
