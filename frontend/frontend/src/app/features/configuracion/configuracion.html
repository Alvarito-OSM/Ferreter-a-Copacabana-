<div class="config-wrapper">
  
  <div class="header-title">
    <h1>Panel de Configuración</h1>
    <p>Administra los datos de la ferretería y tu perfil de usuario.</p>
  </div>

  <div class="config-layout">
    
    <div class="card">
      <div class="card-header">
        <h2>Información de la Empresa</h2>
      </div>
      
      <div class="form-group">
        <label>Nombre de la Empresa</label>
        <input type="text" [(ngModel)]="datosEmpresa.nombre" class="theme-input" [disabled]="!editandoEmpresa">
      </div>

      <div class="form-group">
        <label>RUC / NIT</label>
        <input type="text" [(ngModel)]="datosEmpresa.nit" class="theme-input" [disabled]="!editandoEmpresa">
      </div>

      <div class="form-group">
        <label>Dirección de la ferretería</label>
        <input type="text" [(ngModel)]="datosEmpresa.direccion" class="theme-input" [disabled]="!editandoEmpresa">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Ciudad</label>
          <input type="text" [(ngModel)]="datosEmpresa.ciudad" class="theme-input" [disabled]="!editandoEmpresa">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" [(ngModel)]="datosEmpresa.telefono" class="theme-input" [disabled]="!editandoEmpresa">
        </div>
      </div>

      <div class="card-actions">
        <button *ngIf="!editandoEmpresa" class="btn-edit" (click)="activarEdicionEmpresa()">Editar Información</button>
        
        <ng-container *ngIf="editandoEmpresa">
          <button class="btn-cancel" (click)="cancelarEmpresa()">Cancelar</button>
          <button class="btn-save" (click)="guardarEmpresa()">Guardar Cambios</button>
        </ng-container>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Perfil del Administrador</h2>
      </div>
      
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" [(ngModel)]="perfilAdmin.nombre" class="theme-input" [disabled]="!editandoPerfil">
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="perfilAdmin.email" class="theme-input" [disabled]="!editandoPerfil">
      </div>

      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" [(ngModel)]="perfilAdmin.password" placeholder="Dejar en blanco para mantener la actual" class="theme-input" [disabled]="!editandoPerfil">
      </div>

      <div class="card-actions">
        <button *ngIf="!editandoPerfil" class="btn-edit" (click)="activarEdicionPerfil()">Editar Perfil</button>
        
        <ng-container *ngIf="editandoPerfil">
          <button class="btn-cancel" (click)="cancelarPerfil()">Cancelar</button>
          <button class="btn-save" (click)="guardarPerfil()">Guardar Cambios</button>
        </ng-container>
      </div>
    </div>

  </div>
</div>
