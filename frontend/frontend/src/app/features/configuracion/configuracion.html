<div class="config-container">
  
  <div class="header">
    <h1>⚙️ Configuración del Sistema</h1>
    <p>Administra los datos de la ferretería y tu perfil de usuario.</p>
  </div>

  <div class="config-grid">
    
    <!-- TARJETA 1: Datos de la Empresa -->
    <div class="card">
      <div class="card-header">
        <h3>🏢 Datos de la Empresa</h3>
        <p>Esta información aparecerá en los reportes y facturas.</p>
      </div>
      
      <div class="form-group">
        <label>Nombre de la Ferretería</label>
        <input type="text" [(ngModel)]="datosEmpresa.nombre" class="form-control">
      </div>

      <div class="form-group">
        <label>NIT / Identificación</label>
        <input type="text" [(ngModel)]="datosEmpresa.nit" class="form-control">
      </div>

      <div class="form-group">
        <label>Teléfono de Contacto</label>
        <input type="text" [(ngModel)]="datosEmpresa.telefono" class="form-control">
      </div>

      <div class="form-group">
        <label>Dirección Física</label>
        <input type="text" [(ngModel)]="datosEmpresa.direccion" class="form-control">
      </div>

      <button class="btn-primary" (click)="guardarEmpresa()">💾 Guardar Cambios</button>
    </div>

    <!-- TARJETA 2: Perfil del Administrador -->
    <div class="card">
      <div class="card-header">
        <h3>👤 Mi Perfil</h3>
        <p>Actualiza tus credenciales de acceso.</p>
      </div>

      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" [(ngModel)]="perfilAdmin.nombre" class="form-control">
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="perfilAdmin.email" class="form-control">
      </div>

      <div class="form-group">
        <label>Nueva Contraseña (dejar en blanco para mantener)</label>
        <input type="password" [(ngModel)]="perfilAdmin.password" class="form-control" placeholder="••••••••">
      </div>

      <button class="btn-primary" (click)="guardarPerfil()">🔐 Actualizar Perfil</button>
    </div>

  </div>
</div>
