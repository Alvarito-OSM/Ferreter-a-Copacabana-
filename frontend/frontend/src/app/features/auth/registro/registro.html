<div class="registro-container">
  <div class="registro-card">
    
    <div class="header">
      <h2>Crea tu cuenta</h2>
      <p>Ingresa tus datos para registrarte en el sistema.</p>
    </div>

    @if (exito) {
      <div class="success-state">
        <h3>¡Registro Exitoso!</h3>
        <p>Serás redirigido al inicio de sesión en un momento...</p>
      </div>
    } @else {
      <form (ngSubmit)="guardarCliente()" class="registro-form">
        
        <div class="form-grid">
          <div class="input-group">
            <label>Nombre *</label>
            <input type="text" [(ngModel)]="nuevoCliente.nombre" name="nombre" placeholder="Ej: Juan" required>
          </div>

          <div class="input-group">
            <label>Apellido</label>
            <input type="text" [(ngModel)]="nuevoCliente.apellido" name="apellido" placeholder="Ej: Pérez">
          </div>

          <div class="input-group">
            <label>CI / NIT *</label>
            <input type="text" [(ngModel)]="nuevoCliente.cedulaNit" name="cedulaNit" placeholder="Ej: 12345678" required>
          </div>

          <div class="input-group">
            <label>Teléfono</label>
            <input type="text" [(ngModel)]="nuevoCliente.telefono" name="telefono" placeholder="Ej: 70000000">
          </div>

          <div class="input-group full-width">
            <label>Correo Electrónico</label>
            <input type="email" [(ngModel)]="nuevoCliente.email" name="email" placeholder="correo@ejemplo.com">
          </div>

          <div class="input-group full-width">
            <label>Dirección</label>
            <input type="text" [(ngModel)]="nuevoCliente.direccion" name="direccion" placeholder="Ej: Calle 5 #10-15">
          </div>

          <div class="input-group">
            <label>Usuario *</label>
            <input type="text" [(ngModel)]="nuevoCliente.usuario" name="usuario" placeholder="Elige tu usuario" required>
          </div>

          <div class="input-group">
            <label>Contraseña *</label>
            <input type="password" [(ngModel)]="nuevoCliente.contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" required>
          </div>
        </div>

        @if (error) {
          <div class="error-message">{{ error }}</div>
        }

        <button type="submit" class="btn-submit" [disabled]="cargando">
          {{ cargando ? 'Registrando...' : 'Registrarme' }}
        </button>
      </form>

      <div class="footer-links">
        <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
      </div>
    }
  </div>
</div>
