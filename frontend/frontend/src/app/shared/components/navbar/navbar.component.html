
<header class="navbar">

  <div class="navbar-left">
    <h2 class="page-title">Panel de Control</h2>
  </div>

  <div class="navbar-right">

    <!-- BOTÓN MODO OSCURO / CLARO -->
    <button
      type="button"
      class="theme-toggle"
      (click)="cambiarTema()"
      [attr.aria-label]="modoOscuro
        ? 'Activar modo claro'
        : 'Activar modo oscuro'"
      [title]="modoOscuro
        ? 'Cambiar a modo claro'
        : 'Cambiar a modo oscuro'">

      <i
        class="bi"
        [ngClass]="modoOscuro ? 'bi-sun-fill' : 'bi-moon-stars-fill'">
      </i>

    </button>

    <!-- INFORMACIÓN DEL USUARIO -->
    <div class="user-info">

      <div class="user-avatar">
        {{ usuario.charAt(0).toUpperCase() }}
      </div>

      <div class="user-details">
        <strong>{{ usuario }}</strong>
        <small>{{ rol }}</small>
      </div>

    </div>

    <!-- CERRAR SESIÓN -->
    <button
      type="button"
      class="logout-btn"
      (click)="logout()">

      Cerrar Sesión

    </button>

  </div>

</header>
